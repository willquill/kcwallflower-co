<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kcwallflower.co — Design Options</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bar:#20201c; --bar2:#2a2a24; --cream:#f4efe4; --muted:#a49d8b;
    --line:#3a382f; --accent:#c58a78;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bar); color:var(--cream);
    display:flex; flex-direction:column; height:100vh; height:100svh; overflow:hidden;
  }
  /* top bar */
  .bar{
    flex:0 0 auto; display:flex; align-items:center; gap:1rem;
    padding:.55rem 1rem; background:var(--bar);
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:Georgia,"Times New Roman",serif; font-size:1.02rem; letter-spacing:.01em; white-space:nowrap}
  .brand small{color:var(--muted); font-size:.78rem}
  .tabs{display:flex; gap:.4rem; margin-left:auto; flex-wrap:wrap; justify-content:flex-end}
  .tab{
    font:inherit; font-size:.82rem; color:var(--cream);
    background:transparent; border:1px solid var(--line);
    padding:.44em 1.05em; border-radius:40px; cursor:pointer;
    display:inline-flex; align-items:center; gap:.5em; white-space:nowrap;
    transition:background .2s,border-color .2s,color .2s;
  }
  .tab .k{font-size:.68rem; letter-spacing:.14em; color:var(--muted)}
  .tab:hover{border-color:var(--muted)}
  .tab.active{background:var(--cream); color:var(--bar); border-color:var(--cream)}
  .tab.active .k{color:var(--bar); opacity:.5}
  /* stage */
  .stage{flex:1 1 auto; position:relative; background:#fff}
  .stage iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:none}
  .stage iframe.active{display:block}
  /* loading hint */
  .hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.85rem; letter-spacing:.08em; background:var(--bar);
    pointer-events:none; opacity:0; transition:opacity .2s;
  }
  @media (max-width:680px){
    .bar{flex-wrap:wrap; gap:.5rem .6rem}
    .brand{flex:1 1 100%}
    .tabs{margin-left:0; width:100%; justify-content:space-between}
    .tab{flex:1 1 auto; justify-content:center; padding:.5em .4em; font-size:.76rem}
    .tab .k{display:none}
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">kcwallflower.co <small>· design options — pick one</small></span>
    <div class="tabs" role="tablist" aria-label="Design options">
      <button class="tab" role="tab" data-key="original">Original</button>
      <button class="tab" role="tab" data-key="a"><span class="k">A</span> Heirloom</button>
      <button class="tab" role="tab" data-key="b"><span class="k">B</span> Garden&nbsp;Press</button>
      <button class="tab" role="tab" data-key="c"><span class="k">C</span> Field&nbsp;&amp;&nbsp;Table</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <iframe data-key="original" src="original/" title="Original design" loading="eager"></iframe>
    <iframe data-key="a" src="a/" title="Design A — Heirloom" loading="eager"></iframe>
    <iframe data-key="b" src="b/" title="Design B — Garden Press" loading="eager"></iframe>
    <iframe data-key="c" src="c/" title="Design C — Field & Table" loading="eager"></iframe>
  </div>

  <script>
    const tabs   = Array.from(document.querySelectorAll('.tab'));
    const frames = Array.from(document.querySelectorAll('iframe'));
    const keys   = tabs.map(t => t.dataset.key);

    function select(key){
      if(!keys.includes(key)) key = 'a';
      tabs.forEach(t => {
        const on = t.dataset.key === key;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      frames.forEach(f => f.classList.toggle('active', f.dataset.key === key));
      if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
    }

    tabs.forEach(t => t.addEventListener('click', () => select(t.dataset.key)));
    window.addEventListener('hashchange', () => select(location.hash.slice(1)));

    select(location.hash.slice(1) || 'a');
  </script>
</body>
</html>
